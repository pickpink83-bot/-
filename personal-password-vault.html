<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>账号密码本</title>
  <meta name="theme-color" content="#1f6f61" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="密码本" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./vault-icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./vault-icon.svg" />
  <style>
    :root {
      --bg: #f6f7f5;
      --panel: #fff;
      --text: #202124;
      --muted: #697078;
      --line: #dce2df;
      --soft: #f0f4f2;
      --primary: #1f6f61;
      --primary-dark: #155449;
      --danger: #9a271f;
      --warn-bg: #fff8e8;
      --warn-line: #ead7aa;
      --radius: 8px;
      --shadow: 0 14px 36px rgba(25, 31, 33, .08);
      color-scheme: light;
      font-family: Inter, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, rgba(31,111,97,.08), transparent 280px), var(--bg);
      color: var(--text);
    }

    button, input, textarea { font: inherit; }

    button {
      min-height: 40px;
      border: 1px solid transparent;
      border-radius: 7px;
      padding: 0 14px;
      background: var(--soft);
      color: var(--text);
      cursor: pointer;
    }

    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 3px solid rgba(31,111,97,.22);
      outline-offset: 2px;
    }

    .primary { background: var(--primary); color: #fff; }
    .primary:hover { background: var(--primary-dark); }
    .ghost { background: transparent; border-color: var(--line); }
    .danger { background: #fff0ee; border-color: #f1c3bd; color: var(--danger); }

    input, textarea {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 10px 11px;
      background: #fff;
      color: var(--text);
    }

    textarea {
      min-height: 82px;
      resize: vertical;
    }

    label {
      display: grid;
      gap: 7px;
      color: #3e454b;
      font-size: 13px;
    }

    .hint, .small {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .unlock {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 12px;
    }

    .unlock-panel {
      width: min(460px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 26px;
    }

    .unlock-panel h1 {
      margin: 0 0 6px;
      font-size: 28px;
      letter-spacing: 0;
    }

    .form {
      display: grid;
      gap: 14px;
      margin-top: 22px;
    }

    .notice {
      border: 1px solid var(--warn-line);
      background: var(--warn-bg);
      color: #5b4216;
      border-radius: var(--radius);
      padding: 12px;
      font-size: 13px;
      line-height: 1.5;
    }

    .shell {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 20px;
    }

    .brand h1 {
      margin: 0 0 4px;
      font-size: 26px;
      letter-spacing: 0;
    }

    .layout {
      display: grid;
      grid-template-columns: 330px 1fr;
      gap: 18px;
      align-items: start;
    }

    aside, main {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    aside {
      position: sticky;
      top: 16px;
      padding: 14px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 10px;
      background: #fbfcfb;
    }

    .stat b {
      display: block;
      font-size: 21px;
      line-height: 1;
      margin-bottom: 5px;
    }

    .list {
      display: grid;
      gap: 8px;
      max-height: calc(100vh - 238px);
      overflow: auto;
      padding-right: 4px;
      margin-top: 12px;
    }

    .platform {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      min-height: 64px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fbfcfb;
      padding: 10px;
    }

    .platform.active {
      border-color: var(--primary);
      background: #eef7f4;
    }

    .platform-open {
      min-width: 0;
      min-height: 42px;
      padding: 0;
      border: 0;
      background: transparent;
      text-align: left;
      display: grid;
      align-content: center;
    }

    .platform-title {
      display: block;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .platform-sub {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .quick-copy {
      min-height: 34px;
      padding: 0 10px;
      font-size: 13px;
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 14px;
      border-bottom: 1px solid var(--line);
    }

    .toolbar input { flex: 1; }

    .editor {
      padding: 18px;
      display: grid;
      gap: 16px;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .full { grid-column: 1 / -1; }

    .account-list {
      display: grid;
      gap: 12px;
    }

    .account-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfb;
      padding: 14px;
      display: grid;
      gap: 14px;
    }

    .account-card h3 {
      margin: 0;
      font-size: 16px;
      letter-spacing: 0;
    }

    .account-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .password-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: end;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .left-actions, .right-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .empty {
      min-height: 520px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
      color: var(--muted);
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      max-width: min(360px, calc(100vw - 36px));
      border-radius: 7px;
      padding: 11px 13px;
      background: #202124;
      color: #fff;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
      font-size: 13px;
      z-index: 20;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 840px) {
      .shell { width: min(100vw - 20px, 700px); padding: 14px 0; }
      header { align-items: flex-start; flex-direction: column; }
      .layout { grid-template-columns: 1fr; }
      aside { position: static; }
      .list { max-height: 320px; }
      .toolbar { flex-wrap: wrap; }
      .toolbar input { min-width: 100%; }
      .grid { grid-template-columns: 1fr; }
      .platform { grid-template-columns: 1fr; }
      .quick-copy { width: 100%; }
      .password-row { grid-template-columns: 1fr; }
      .password-row button { width: 100%; }
      .actions { flex-direction: column-reverse; }
      .left-actions button, .right-actions button { flex: 1; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const STORAGE_KEY = "personal-password-vault.v1";
    const app = document.getElementById("app");
    const toast = document.getElementById("toast");
    const enc = new TextEncoder();
    const dec = new TextDecoder();

    const state = {
      unlocked: false,
      key: null,
      salt: null,
      entries: [],
      selectedId: null,
      query: ""
    };

    function bytesToBase64(bytes) {
      let bin = "";
      bytes.forEach(byte => bin += String.fromCharCode(byte));
      return btoa(bin);
    }

    function base64ToBytes(value) {
      const bin = atob(value);
      return Uint8Array.from(bin, char => char.charCodeAt(0));
    }

    async function deriveKey(masterPassword, salt) {
      const baseKey = await crypto.subtle.importKey("raw", enc.encode(masterPassword), "PBKDF2", false, ["deriveKey"]);
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: 250000, hash: "SHA-256" },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function encryptVault() {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const data = enc.encode(JSON.stringify(state.entries));
      const encrypted = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, state.key, data);
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        version: 2,
        salt: bytesToBase64(state.salt),
        iv: bytesToBase64(iv),
        data: bytesToBase64(new Uint8Array(encrypted)),
        savedAt: new Date().toISOString()
      }));
    }

    async function decryptVault(masterPassword) {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      const salt = base64ToBytes(saved.salt);
      const key = await deriveKey(masterPassword, salt);
      const plain = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(saved.iv) },
        key,
        base64ToBytes(saved.data)
      );
      return { key, salt, entries: normalizeEntries(JSON.parse(dec.decode(plain))) };
    }

    function normalizeEntries(entries) {
      return (entries || []).map(entry => {
        if (Array.isArray(entry.accounts)) {
          return {
            ...entry,
            accounts: entry.accounts.map(normalizeAccount)
          };
        }
        return {
          id: entry.id || crypto.randomUUID(),
          title: entry.title || "未命名平台",
          url: entry.url || "",
          notes: entry.notes || "",
          createdAt: entry.createdAt || new Date().toISOString(),
          updatedAt: entry.updatedAt || new Date().toISOString(),
          accounts: [normalizeAccount({
            label: entry.username || entry.email || "账号 1",
            username: entry.username || "",
            contact: entry.email || "",
            password: entry.password || "",
            notes: entry.notes || ""
          })]
        };
      });
    }

    function normalizeAccount(account) {
      return {
        id: account.id || crypto.randomUUID(),
        label: account.label || "",
        username: account.username || "",
        contact: account.contact || account.email || "",
        password: account.password || "",
        notes: account.notes || ""
      };
    }

    function escapeHtml(value = "") {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[char]));
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 2200);
    }

    function selectedEntry() {
      return state.entries.find(entry => entry.id === state.selectedId) || null;
    }

    function accountCount() {
      return state.entries.reduce((total, entry) => total + entry.accounts.length, 0);
    }

    function displayAccount(entry) {
      return entry.accounts.find(account => account.username || account.password) || entry.accounts[0];
    }

    function filteredEntries() {
      const q = state.query.trim().toLowerCase();
      const list = q ? state.entries.filter(entry => {
        const platformMatch = [entry.title, entry.url, entry.notes].some(value => (value || "").toLowerCase().includes(q));
        const accountMatch = entry.accounts.some(account =>
          [account.label, account.username, account.contact, account.notes].some(value => (value || "").toLowerCase().includes(q))
        );
        return platformMatch || accountMatch;
      }) : state.entries;
      return [...list].sort((a, b) => (a.title || "").localeCompare(b.title || "", "zh-CN"));
    }

    function renderLocked() {
      const hasVault = Boolean(localStorage.getItem(STORAGE_KEY));
      app.innerHTML = `
        <section class="unlock">
          <div class="unlock-panel">
            <h1>账号密码本</h1>
            <p class="hint">${hasVault ? "输入主密码，查看你保存的平台账号。" : "设置一个主密码，创建你的账号密码本。"}</p>
            <form class="form" id="unlockForm">
              <label>
                主密码
                <input id="masterPassword" type="password" minlength="10" autocomplete="current-password" required />
              </label>
              ${hasVault ? "" : `
                <label>
                  再输入一次
                  <input id="confirmPassword" type="password" minlength="10" autocomplete="new-password" required />
                </label>
              `}
              <div class="notice">主密码不会被保存。忘记主密码时，已保存的账号密码无法恢复。</div>
              <button class="primary" type="submit">${hasVault ? "打开密码本" : "创建密码本"}</button>
            </form>
          </div>
        </section>
      `;

      document.getElementById("unlockForm").addEventListener("submit", async event => {
        event.preventDefault();
        const masterPassword = document.getElementById("masterPassword").value;
        try {
          if (hasVault) {
            const vault = await decryptVault(masterPassword);
            state.key = vault.key;
            state.salt = vault.salt;
            state.entries = vault.entries;
            state.unlocked = true;
            state.selectedId = state.entries[0]?.id || null;
            await encryptVault();
            render();
            showToast("已打开密码本");
          } else {
            const confirmPassword = document.getElementById("confirmPassword").value;
            if (masterPassword !== confirmPassword) {
              showToast("两次输入的主密码不一致");
              return;
            }
            if (masterPassword.length < 10) {
              showToast("主密码至少需要 10 个字符");
              return;
            }
            state.salt = crypto.getRandomValues(new Uint8Array(16));
            state.key = await deriveKey(masterPassword, state.salt);
            state.entries = [];
            state.unlocked = true;
            await encryptVault();
            render();
            showToast("密码本已创建");
          }
        } catch (error) {
          showToast("无法打开，请检查主密码");
        }
      });
    }

    function render() {
      if (!state.unlocked) {
        renderLocked();
        return;
      }

      const selected = selectedEntry();
      const list = filteredEntries();

      app.innerHTML = `
        <div class="shell">
          <header>
            <div class="brand">
              <h1>账号密码本</h1>
              <p class="hint">一个平台可以保存多个账号，密码默认显示，随手复制。</p>
            </div>
            <button class="ghost" id="lockButton">锁定</button>
          </header>
          <div class="layout">
            <aside>
              <div class="stats">
                <div class="stat"><b>${state.entries.length}</b><span class="small">平台</span></div>
                <div class="stat"><b>${accountCount()}</b><span class="small">账号</span></div>
              </div>
              <button class="primary" id="newEntry" style="width:100%;">添加平台</button>
              <div class="list" aria-label="平台列表">
                ${list.length ? list.map(entry => platformTemplate(entry)).join("") : `<p class="hint" style="padding:8px;">没有匹配的平台账号。</p>`}
              </div>
            </aside>
            <main>
              <div class="toolbar">
                <input id="searchInput" type="search" placeholder="搜索平台、账号、手机号、备注" value="${escapeHtml(state.query)}" />
                <button id="exportButton" class="ghost">导出备份</button>
                <button id="importButton" class="ghost">导入备份</button>
                <input id="importFile" type="file" accept="application/json" hidden />
              </div>
              ${selected ? editorTemplate(selected) : emptyTemplate()}
            </main>
          </div>
        </div>
      `;

      bindEvents();
    }

    function platformTemplate(entry) {
      const account = displayAccount(entry);
      const sub = entry.accounts.length > 1
        ? `${entry.accounts.length} 个账号 · ${account?.username || account?.label || "未填写账号"}`
        : (account?.username || account?.contact || "还没有填写账号");
      return `
        <div class="platform ${entry.id === state.selectedId ? "active" : ""}">
          <button class="platform-open" data-id="${entry.id}">
            <span class="platform-title">${escapeHtml(entry.title || "未命名平台")}</span>
            <span class="platform-sub">${escapeHtml(sub)}</span>
          </button>
          <button class="quick-copy ghost" data-copy-id="${entry.id}">复制密码</button>
        </div>
      `;
    }

    function editorTemplate(entry) {
      return `
        <form class="editor" id="entryForm">
          <div class="section-head">
            <div>
              <h2>${escapeHtml(entry.title || "未命名平台")}</h2>
              <p class="small">${entry.accounts.length} 个账号</p>
            </div>
            <button type="button" id="addAccount" class="primary">添加账号</button>
          </div>

          <div class="grid">
            <label>
              平台名称
              <input name="title" value="${escapeHtml(entry.title)}" placeholder="例如：微信、小红书、淘宝、邮箱" required />
            </label>
            <label>
              登录网址
              <input name="url" type="url" value="${escapeHtml(entry.url)}" placeholder="https://example.com" />
            </label>
            <label class="full">
              平台备注
              <textarea name="notes" placeholder="这个平台的通用备注，例如会员、恢复码位置、登录说明等">${escapeHtml(entry.notes)}</textarea>
            </label>
          </div>

          <div class="account-list">
            ${entry.accounts.map((account, index) => accountTemplate(account, index)).join("")}
          </div>

          <div class="actions">
            <div class="left-actions">
              <button type="button" class="danger" id="deleteEntry">删除平台</button>
            </div>
            <div class="right-actions">
              <button type="button" class="ghost" id="openSite">打开登录页</button>
              <button type="submit" class="primary">保存</button>
            </div>
          </div>
        </form>
      `;
    }

    function accountTemplate(account, index) {
      const title = account.label || account.username || `账号 ${index + 1}`;
      return `
        <section class="account-card" data-account-id="${account.id}">
          <div class="account-head">
            <h3>${escapeHtml(title)}</h3>
            <button type="button" class="danger delete-account" data-account-id="${account.id}">删除账号</button>
          </div>
          <div class="grid">
            <label>
              账号备注名
              <input name="accountLabel:${account.id}" value="${escapeHtml(account.label)}" placeholder="例如：主号、小号、工作号" />
            </label>
            <label>
              登录账号
              <input name="username:${account.id}" value="${escapeHtml(account.username)}" placeholder="用户名、手机号或邮箱" autocomplete="off" />
            </label>
            <label>
              绑定手机/邮箱
              <input name="contact:${account.id}" value="${escapeHtml(account.contact)}" placeholder="用于找回账号的信息" autocomplete="off" />
            </label>
            <label>
              密码
              <span class="password-row">
                <input name="password:${account.id}" type="text" value="${escapeHtml(account.password)}" autocomplete="off" placeholder="手动输入这个账号的密码" />
                <button type="button" class="primary copy-account" data-account-id="${account.id}">复制密码</button>
              </span>
            </label>
            <label class="full">
              账号备注
              <textarea name="accountNotes:${account.id}" placeholder="安全问题、登录方式、恢复码、会员信息等">${escapeHtml(account.notes)}</textarea>
            </label>
          </div>
        </section>
      `;
    }

    function emptyTemplate() {
      return `
        <div class="empty">
          <div>
            <h2>还没有平台</h2>
            <p>先添加一个平台，再在里面保存一个或多个账号。</p>
          </div>
        </div>
      `;
    }

    function bindEvents() {
      document.getElementById("lockButton").addEventListener("click", () => {
        state.unlocked = false;
        state.key = null;
        state.entries = [];
        state.selectedId = null;
        render();
      });

      document.getElementById("newEntry").addEventListener("click", async () => {
        const entry = {
          id: crypto.randomUUID(),
          title: "新平台",
          url: "",
          notes: "",
          accounts: [normalizeAccount({ label: "账号 1" })],
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        };
        state.entries.push(entry);
        state.selectedId = entry.id;
        await encryptVault();
        render();
      });

      document.getElementById("searchInput").addEventListener("input", event => {
        state.query = event.target.value;
        render();
      });

      document.querySelectorAll(".platform-open").forEach(button => {
        button.addEventListener("click", () => {
          state.selectedId = button.dataset.id;
          render();
        });
      });

      document.querySelectorAll(".quick-copy").forEach(button => {
        button.addEventListener("click", async () => {
          const entry = state.entries.find(item => item.id === button.dataset.copyId);
          const account = displayAccount(entry);
          await copyPassword(account?.password);
        });
      });

      document.getElementById("exportButton").addEventListener("click", exportBackup);
      document.getElementById("importButton").addEventListener("click", () => document.getElementById("importFile").click());
      document.getElementById("importFile").addEventListener("change", importBackup);

      const form = document.getElementById("entryForm");
      if (!form) return;

      document.getElementById("addAccount").addEventListener("click", async () => {
        const entry = selectedEntry();
        saveFormToEntry(form, entry);
        entry.accounts.push(normalizeAccount({ label: `账号 ${entry.accounts.length + 1}` }));
        entry.updatedAt = new Date().toISOString();
        await encryptVault();
        render();
      });

      form.addEventListener("submit", async event => {
        event.preventDefault();
        const entry = selectedEntry();
        saveFormToEntry(form, entry);
        await encryptVault();
        render();
        showToast("已保存");
      });

      document.querySelectorAll(".copy-account").forEach(button => {
        button.addEventListener("click", () => {
          const formData = new FormData(form);
          copyPassword(formData.get(`password:${button.dataset.accountId}`));
        });
      });

      document.querySelectorAll(".delete-account").forEach(button => {
        button.addEventListener("click", async () => {
          const entry = selectedEntry();
          if (entry.accounts.length <= 1) {
            showToast("每个平台至少保留一个账号");
            return;
          }
          if (!confirm("确定删除这个账号吗？")) return;
          saveFormToEntry(form, entry);
          entry.accounts = entry.accounts.filter(account => account.id !== button.dataset.accountId);
          entry.updatedAt = new Date().toISOString();
          await encryptVault();
          render();
          showToast("已删除账号");
        });
      });

      document.getElementById("deleteEntry").addEventListener("click", async () => {
        if (!confirm("确定删除这个平台和下面所有账号吗？")) return;
        state.entries = state.entries.filter(entry => entry.id !== state.selectedId);
        state.selectedId = state.entries[0]?.id || null;
        await encryptVault();
        render();
        showToast("已删除平台");
      });

      document.getElementById("openSite").addEventListener("click", () => {
        const entry = selectedEntry();
        if (!entry?.url) {
          showToast("这个平台没有登录网址");
          return;
        }
        window.open(entry.url, "_blank", "noopener,noreferrer");
      });
    }

    function saveFormToEntry(form, entry) {
      const data = new FormData(form);
      entry.title = data.get("title").trim();
      entry.url = data.get("url").trim();
      entry.notes = data.get("notes").trim();
      entry.accounts = entry.accounts.map(account => ({
        ...account,
        label: data.get(`accountLabel:${account.id}`).trim(),
        username: data.get(`username:${account.id}`).trim(),
        contact: data.get(`contact:${account.id}`).trim(),
        password: data.get(`password:${account.id}`).trim(),
        notes: data.get(`accountNotes:${account.id}`).trim()
      }));
      entry.updatedAt = new Date().toISOString();
    }

    async function copyPassword(password) {
      if (!password) {
        showToast("这个账号还没有填写密码");
        return;
      }
      await navigator.clipboard.writeText(password);
      showToast("密码已复制");
    }

    function exportBackup() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) {
        showToast("没有可导出的数据");
        return;
      }
      const blob = new Blob([saved], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `account-password-book-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    async function importBackup(event) {
      const file = event.target.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        const parsed = JSON.parse(text);
        if (!parsed.salt || !parsed.iv || !parsed.data) throw new Error("Invalid backup");
        localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
        state.unlocked = false;
        state.key = null;
        state.entries = [];
        state.selectedId = null;
        render();
        showToast("已导入，请用备份对应的主密码打开");
      } catch (error) {
        showToast("导入失败，文件格式不正确");
      } finally {
        event.target.value = "";
      }
    }

    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      navigator.serviceWorker.register("./service-worker.js").catch(() => {});
    }

    render();
  </script>
</body>
</html>
