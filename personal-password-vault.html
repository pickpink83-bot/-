<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>个人密码库</title>
  <meta name="theme-color" content="#1f6f61" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="密码库" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./vault-icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./vault-icon.svg" />
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f7f4;
      --panel: #ffffff;
      --text: #202124;
      --muted: #666c73;
      --line: #d9dedc;
      --primary: #1f6f61;
      --primary-strong: #155449;
      --accent: #b74b3f;
      --warn: #9a5b11;
      --shadow: 0 12px 32px rgba(24, 29, 31, 0.08);
      --radius: 8px;
      font-family: Inter, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(31,111,97,0.08), transparent 300px),
        var(--bg);
      color: var(--text);
    }

    button, input, textarea {
      font: inherit;
    }

    button {
      border: 1px solid transparent;
      border-radius: 7px;
      cursor: pointer;
      min-height: 38px;
      padding: 0 14px;
      background: #eef2f0;
      color: var(--text);
    }

    button:hover { filter: brightness(0.98); }
    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 3px solid rgba(31, 111, 97, 0.22);
      outline-offset: 2px;
    }

    .primary { background: var(--primary); color: white; }
    .primary:hover { background: var(--primary-strong); filter: none; }
    .danger { color: #8b1e16; background: #fff0ee; border-color: #f2c4bd; }
    .ghost { background: transparent; border-color: var(--line); }
    .icon-button {
      width: 38px;
      padding: 0;
      display: inline-grid;
      place-items: center;
      font-weight: 700;
    }

    .shell {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 22px;
    }

    .brand h1 {
      font-size: 26px;
      line-height: 1.2;
      margin: 0 0 4px;
      letter-spacing: 0;
    }

    .brand p, .hint, .small {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .unlock {
      min-height: calc(100vh - 56px);
      display: grid;
      place-items: center;
      padding: 28px 0;
    }

    .unlock-panel {
      width: min(460px, calc(100vw - 32px));
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 26px;
    }

    .unlock-panel h1 {
      margin: 0 0 6px;
      font-size: 28px;
      letter-spacing: 0;
    }

    .form {
      display: grid;
      gap: 14px;
      margin-top: 22px;
    }

    label {
      display: grid;
      gap: 7px;
      font-size: 13px;
      color: #3d4348;
    }

    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 10px 11px;
      background: white;
      color: var(--text);
      min-height: 40px;
    }

    textarea {
      resize: vertical;
      min-height: 76px;
    }

    .notice {
      border: 1px solid #ead7aa;
      background: #fff9eb;
      color: #5e4111;
      border-radius: var(--radius);
      padding: 12px;
      font-size: 13px;
      line-height: 1.5;
    }

    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 18px;
      align-items: start;
    }

    aside, main {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    aside { padding: 14px; position: sticky; top: 16px; }
    main { min-height: 620px; }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 14px;
      border-bottom: 1px solid var(--line);
    }

    .toolbar input { flex: 1; }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 10px;
      background: #fafbf9;
    }

    .stat b {
      display: block;
      font-size: 20px;
      line-height: 1;
      margin-bottom: 5px;
    }

    .list {
      display: grid;
      gap: 8px;
      max-height: calc(100vh - 230px);
      overflow: auto;
      padding-right: 4px;
    }

    .item {
      width: 100%;
      min-height: 62px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      text-align: left;
      background: #fbfcfb;
      border: 1px solid var(--line);
      padding: 10px;
      border-radius: 7px;
    }

    .item.active {
      border-color: var(--primary);
      background: #eef7f4;
    }

    .item-title {
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .item-sub {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .strength {
      align-self: start;
      border-radius: 999px;
      min-width: 54px;
      text-align: center;
      font-size: 12px;
      padding: 3px 7px;
      color: white;
      background: var(--muted);
    }

    .weak { background: var(--accent); }
    .medium { background: var(--warn); }
    .strong { background: var(--primary); }

    .editor {
      padding: 18px;
      display: grid;
      gap: 16px;
    }

    .editor-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .editor-head h2 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .full { grid-column: 1 / -1; }

    .field-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      align-items: end;
    }

    .password-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
    }

    .range {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .range input {
      padding: 0;
      min-height: auto;
      width: 118px;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding-top: 2px;
    }

    .left-actions, .right-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .empty {
      min-height: 530px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
      color: var(--muted);
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      max-width: min(360px, calc(100vw - 36px));
      background: #202124;
      color: white;
      border-radius: 7px;
      padding: 11px 13px;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
      font-size: 13px;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 820px) {
      .shell { width: min(100vw - 20px, 680px); padding: 14px 0; }
      header { align-items: flex-start; flex-direction: column; }
      .layout { grid-template-columns: 1fr; }
      aside { position: static; }
      .list { max-height: 280px; }
      .grid { grid-template-columns: 1fr; }
      .field-row { grid-template-columns: 1fr auto auto; }
      .toolbar { flex-wrap: wrap; }
      .toolbar input { min-width: 100%; }
      .actions { flex-direction: column-reverse; }
      .left-actions, .right-actions { width: 100%; }
      .left-actions button, .right-actions button { flex: 1; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const STORAGE_KEY = "personal-password-vault.v1";
    const app = document.getElementById("app");
    const toast = document.getElementById("toast");

    const state = {
      unlocked: false,
      key: null,
      salt: null,
      entries: [],
      selectedId: null,
      query: "",
      revealPassword: false,
      length: 18
    };

    const enc = new TextEncoder();
    const dec = new TextDecoder();

    function bytesToBase64(bytes) {
      let bin = "";
      bytes.forEach(byte => bin += String.fromCharCode(byte));
      return btoa(bin);
    }

    function base64ToBytes(value) {
      const bin = atob(value);
      return Uint8Array.from(bin, char => char.charCodeAt(0));
    }

    async function deriveKey(masterPassword, salt) {
      const baseKey = await crypto.subtle.importKey(
        "raw",
        enc.encode(masterPassword),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: 250000, hash: "SHA-256" },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function encryptVault() {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const data = enc.encode(JSON.stringify(state.entries));
      const encrypted = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, state.key, data);
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        version: 1,
        salt: bytesToBase64(state.salt),
        iv: bytesToBase64(iv),
        data: bytesToBase64(new Uint8Array(encrypted)),
        savedAt: new Date().toISOString()
      }));
    }

    async function decryptVault(masterPassword) {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      const salt = base64ToBytes(saved.salt);
      const key = await deriveKey(masterPassword, salt);
      const plain = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(saved.iv) },
        key,
        base64ToBytes(saved.data)
      );
      return { key, salt, entries: JSON.parse(dec.decode(plain)) };
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 2200);
    }

    function escapeHtml(value = "") {
      return value.replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[char]));
    }

    function scorePassword(password = "") {
      let score = 0;
      if (password.length >= 12) score++;
      if (password.length >= 18) score++;
      if (/[a-z]/.test(password) && /[A-Z]/.test(password)) score++;
      if (/\d/.test(password)) score++;
      if (/[^A-Za-z0-9]/.test(password)) score++;
      if (password.length < 8) score = 0;
      if (score <= 2) return { label: "较弱", className: "weak" };
      if (score <= 4) return { label: "中等", className: "medium" };
      return { label: "强", className: "strong" };
    }

    function filteredEntries() {
      const q = state.query.trim().toLowerCase();
      const list = q ? state.entries.filter(entry =>
        [entry.title, entry.username, entry.url, entry.notes].some(v => (v || "").toLowerCase().includes(q))
      ) : state.entries;
      return [...list].sort((a, b) => (a.title || "").localeCompare(b.title || "", "zh-CN"));
    }

    function selectedEntry() {
      return state.entries.find(entry => entry.id === state.selectedId) || null;
    }

    function renderLocked() {
      const hasVault = Boolean(localStorage.getItem(STORAGE_KEY));
      app.innerHTML = `
        <section class="unlock">
          <div class="unlock-panel">
            <h1>个人密码库</h1>
            <p class="hint">${hasVault ? "输入主密码解锁本地密码库。" : "设置一个主密码，创建你的本地加密密码库。"}</p>
            <form class="form" id="unlockForm">
              <label>
                主密码
                <input id="masterPassword" type="password" minlength="10" autocomplete="current-password" required />
              </label>
              ${hasVault ? "" : `
                <label>
                  再输入一次
                  <input id="confirmPassword" type="password" minlength="10" autocomplete="new-password" required />
                </label>
              `}
              <div class="notice">主密码不会被保存。忘记主密码时，已保存的数据无法恢复。</div>
              <button class="primary" type="submit">${hasVault ? "解锁" : "创建密码库"}</button>
            </form>
          </div>
        </section>
      `;

      document.getElementById("unlockForm").addEventListener("submit", async event => {
        event.preventDefault();
        const masterPassword = document.getElementById("masterPassword").value;
        try {
          if (hasVault) {
            const vault = await decryptVault(masterPassword);
            state.key = vault.key;
            state.salt = vault.salt;
            state.entries = vault.entries;
            state.unlocked = true;
            state.selectedId = state.entries[0]?.id || null;
            render();
            showToast("已解锁");
          } else {
            const confirmPassword = document.getElementById("confirmPassword").value;
            if (masterPassword !== confirmPassword) {
              showToast("两次输入的主密码不一致");
              return;
            }
            if (masterPassword.length < 10) {
              showToast("主密码至少需要 10 个字符");
              return;
            }
            state.salt = crypto.getRandomValues(new Uint8Array(16));
            state.key = await deriveKey(masterPassword, state.salt);
            state.entries = [];
            state.unlocked = true;
            await encryptVault();
            render();
            showToast("密码库已创建");
          }
        } catch (error) {
          showToast("无法解锁，请检查主密码");
        }
      });
    }

    function render() {
      if (!state.unlocked) {
        renderLocked();
        return;
      }

      const selected = selectedEntry();
      const list = filteredEntries();
      const weakCount = state.entries.filter(entry => scorePassword(entry.password).className === "weak").length;
      const duplicated = new Set();
      const seen = new Map();
      state.entries.forEach(entry => {
        if (!entry.password) return;
        if (seen.has(entry.password)) duplicated.add(entry.password);
        seen.set(entry.password, true);
      });

      app.innerHTML = `
        <div class="shell">
          <header>
            <div class="brand">
              <h1>个人密码库</h1>
              <p>本地加密保存，关闭页面前会自动写入浏览器存储。</p>
            </div>
            <button class="ghost" id="lockButton">锁定</button>
          </header>
          <div class="layout">
            <aside>
              <div class="stats">
                <div class="stat"><b>${state.entries.length}</b><span class="small">条目</span></div>
                <div class="stat"><b>${weakCount}</b><span class="small">较弱</span></div>
                <div class="stat"><b>${duplicated.size}</b><span class="small">重复</span></div>
              </div>
              <button class="primary" id="newEntry" style="width:100%; margin-bottom:12px;">新建条目</button>
              <div class="list" aria-label="密码条目列表">
                ${list.length ? list.map(entry => {
                  const strength = scorePassword(entry.password);
                  return `
                    <button class="item ${entry.id === state.selectedId ? "active" : ""}" data-id="${entry.id}">
                      <span>
                        <span class="item-title">${escapeHtml(entry.title || "未命名")}</span>
                        <span class="item-sub">${escapeHtml(entry.username || entry.url || "没有账号信息")}</span>
                      </span>
                      <span class="strength ${strength.className}">${strength.label}</span>
                    </button>
                  `;
                }).join("") : `<p class="hint" style="padding:8px;">没有匹配的条目。</p>`}
              </div>
            </aside>
            <main>
              <div class="toolbar">
                <input id="searchInput" type="search" placeholder="搜索网站、账号、备注" value="${escapeHtml(state.query)}" />
                <button id="exportButton" class="ghost">导出加密备份</button>
                <button id="importButton" class="ghost">导入备份</button>
                <input id="importFile" type="file" accept="application/json" hidden />
              </div>
              ${selected ? editorTemplate(selected) : emptyTemplate()}
            </main>
          </div>
        </div>
      `;

      bindEvents();
    }

    function editorTemplate(entry) {
      const strength = scorePassword(entry.password);
      return `
        <form class="editor" id="entryForm">
          <div class="editor-head">
            <div>
              <h2>${escapeHtml(entry.title || "未命名条目")}</h2>
              <p class="small">密码强度：<span class="strength ${strength.className}">${strength.label}</span></p>
            </div>
          </div>
          <div class="grid">
            <label>
              名称
              <input name="title" value="${escapeHtml(entry.title)}" placeholder="例如：邮箱、银行、服务器" required />
            </label>
            <label>
              网站
              <input name="url" type="url" value="${escapeHtml(entry.url)}" placeholder="https://example.com" />
            </label>
            <label>
              用户名
              <input name="username" value="${escapeHtml(entry.username)}" autocomplete="off" />
            </label>
            <label>
              邮箱
              <input name="email" type="email" value="${escapeHtml(entry.email)}" autocomplete="off" />
            </label>
            <div class="full">
              <label>
                密码
                <span class="field-row">
                  <input name="password" id="passwordInput" type="${state.revealPassword ? "text" : "password"}" value="${escapeHtml(entry.password)}" autocomplete="off" />
                  <button type="button" class="icon-button ghost" id="toggleReveal" title="${state.revealPassword ? "隐藏密码" : "显示密码"}">${state.revealPassword ? "H" : "S"}</button>
                  <button type="button" class="icon-button ghost" id="copyPassword" title="复制密码">C</button>
                </span>
              </label>
              <div class="password-tools">
                <button type="button" id="generatePassword">生成强密码</button>
                <span class="range">
                  长度
                  <input id="lengthRange" type="range" min="12" max="32" value="${state.length}" />
                  <b id="lengthValue">${state.length}</b>
                </span>
              </div>
            </div>
            <label class="full">
              备注
              <textarea name="notes" placeholder="安全问题、恢复码存放位置、到期提醒等">${escapeHtml(entry.notes)}</textarea>
            </label>
          </div>
          <div class="actions">
            <div class="left-actions">
              <button type="button" class="danger" id="deleteEntry">删除</button>
            </div>
            <div class="right-actions">
              <button type="button" class="ghost" id="openSite">打开网站</button>
              <button type="submit" class="primary">保存</button>
            </div>
          </div>
        </form>
      `;
    }

    function emptyTemplate() {
      return `
        <div class="empty">
          <div>
            <h2>还没有条目</h2>
            <p>新建一个网站账号，密码库会自动加密保存。</p>
          </div>
        </div>
      `;
    }

    function bindEvents() {
      document.getElementById("lockButton").addEventListener("click", () => {
        state.unlocked = false;
        state.key = null;
        state.entries = [];
        state.selectedId = null;
        render();
      });

      document.getElementById("newEntry").addEventListener("click", async () => {
        const entry = {
          id: crypto.randomUUID(),
          title: "新条目",
          url: "",
          username: "",
          email: "",
          password: generatePasswordValue(state.length),
          notes: "",
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        };
        state.entries.push(entry);
        state.selectedId = entry.id;
        await encryptVault();
        render();
      });

      document.getElementById("searchInput").addEventListener("input", event => {
        state.query = event.target.value;
        render();
      });

      document.querySelectorAll(".item").forEach(button => {
        button.addEventListener("click", () => {
          state.selectedId = button.dataset.id;
          state.revealPassword = false;
          render();
        });
      });

      document.getElementById("exportButton").addEventListener("click", exportBackup);
      document.getElementById("importButton").addEventListener("click", () => document.getElementById("importFile").click());
      document.getElementById("importFile").addEventListener("change", importBackup);

      const form = document.getElementById("entryForm");
      if (!form) return;

      form.addEventListener("submit", async event => {
        event.preventDefault();
        const entry = selectedEntry();
        const data = new FormData(form);
        ["title", "url", "username", "email", "password", "notes"].forEach(field => {
          entry[field] = data.get(field).trim();
        });
        entry.updatedAt = new Date().toISOString();
        await encryptVault();
        render();
        showToast("已保存");
      });

      document.getElementById("deleteEntry").addEventListener("click", async () => {
        if (!confirm("确定删除这个条目吗？")) return;
        state.entries = state.entries.filter(entry => entry.id !== state.selectedId);
        state.selectedId = state.entries[0]?.id || null;
        await encryptVault();
        render();
        showToast("已删除");
      });

      document.getElementById("toggleReveal").addEventListener("click", () => {
        state.revealPassword = !state.revealPassword;
        render();
      });

      document.getElementById("copyPassword").addEventListener("click", async () => {
        const password = document.getElementById("passwordInput").value;
        await navigator.clipboard.writeText(password);
        showToast("密码已复制");
      });

      document.getElementById("generatePassword").addEventListener("click", () => {
        document.getElementById("passwordInput").value = generatePasswordValue(state.length);
        showToast("已生成新密码，点击保存后生效");
      });

      document.getElementById("lengthRange").addEventListener("input", event => {
        state.length = Number(event.target.value);
        document.getElementById("lengthValue").textContent = state.length;
      });

      document.getElementById("openSite").addEventListener("click", () => {
        const entry = selectedEntry();
        if (!entry?.url) {
          showToast("这个条目没有网站地址");
          return;
        }
        window.open(entry.url, "_blank", "noopener,noreferrer");
      });
    }

    function generatePasswordValue(length) {
      const upper = "ABCDEFGHJKLMNPQRSTUVWXYZ";
      const lower = "abcdefghijkmnopqrstuvwxyz";
      const nums = "23456789";
      const symbols = "!@#$%^&*()-_=+[]{}?";
      const all = upper + lower + nums + symbols;
      const bytes = crypto.getRandomValues(new Uint8Array(length));
      const chars = [
        upper[bytes[0] % upper.length],
        lower[bytes[1] % lower.length],
        nums[bytes[2] % nums.length],
        symbols[bytes[3] % symbols.length]
      ];
      for (let i = 4; i < length; i++) chars.push(all[bytes[i] % all.length]);
      return chars.sort(() => crypto.getRandomValues(new Uint32Array(1))[0] - 2147483648).join("");
    }

    function exportBackup() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) {
        showToast("没有可导出的数据");
        return;
      }
      const blob = new Blob([saved], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `password-vault-backup-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    async function importBackup(event) {
      const file = event.target.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        const parsed = JSON.parse(text);
        if (!parsed.salt || !parsed.iv || !parsed.data) throw new Error("Invalid backup");
        localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
        state.unlocked = false;
        state.key = null;
        state.entries = [];
        state.selectedId = null;
        render();
        showToast("已导入，请用备份对应的主密码解锁");
      } catch (error) {
        showToast("导入失败，文件格式不正确");
      } finally {
        event.target.value = "";
      }
    }

    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      navigator.serviceWorker.register("./service-worker.js").catch(() => {});
    }

    render();
  </script>
</body>
</html>
