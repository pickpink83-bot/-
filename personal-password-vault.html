<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>账号密码本</title>
  <meta name="theme-color" content="#f5f5f7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="密码本" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./vault-icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./vault-icon.svg" />
  <style>
    :root {
      --bg: #f5f5f7;
      --panel: rgba(255, 255, 255, .78);
      --card: #fff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --line: rgba(60, 60, 67, .16);
      --fill: rgba(118, 118, 128, .12);
      --fill-strong: rgba(118, 118, 128, .18);
      --blue: #007aff;
      --green: #34c759;
      --red: #ff3b30;
      --shadow: 0 18px 46px rgba(0, 0, 0, .08);
      --radius: 20px;
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(0, 122, 255, .13), transparent 34vw),
        radial-gradient(circle at top right, rgba(52, 199, 89, .12), transparent 30vw),
        var(--bg);
      color: var(--text);
    }

    button, input, textarea { font: inherit; }

    button {
      border: 0;
      cursor: pointer;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }

    input, textarea {
      width: 100%;
      border: 0;
      border-radius: 14px;
      background: var(--fill);
      color: var(--text);
      padding: 12px 13px;
      min-height: 46px;
      outline: none;
    }

    input:focus, textarea:focus {
      box-shadow: 0 0 0 3px rgba(0, 122, 255, .18);
      background: #fff;
    }

    textarea {
      min-height: 86px;
      resize: vertical;
    }

    label {
      display: grid;
      gap: 7px;
      font-size: 13px;
      color: var(--muted);
    }

    .hint, .small {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .icon {
      width: 20px;
      height: 20px;
      display: block;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--fill);
      color: var(--text);
      flex: 0 0 auto;
      padding: 0;
      line-height: 1;
      position: relative;
      appearance: none;
      -webkit-appearance: none;
    }

    .icon-btn > .icon,
    .quick-copy > .icon {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      margin: 0;
    }

    .icon-btn:hover { background: var(--fill-strong); }
    .icon-btn.primary { background: var(--blue); color: #fff; }
    .icon-btn.green { background: var(--green); color: #fff; }
    .icon-btn.danger { background: rgba(255, 59, 48, .12); color: var(--red); }

    .text-btn {
      min-height: 46px;
      border-radius: 14px;
      padding: 0 16px;
      background: var(--blue);
      color: #fff;
      font-weight: 700;
    }

    .glass {
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, .62);
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    .unlock {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 22px;
    }

    .unlock-panel {
      width: min(430px, 100%);
      border-radius: 26px;
      padding: 26px;
    }

    .app-icon {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #007aff, #34c759);
      color: #fff;
      margin-bottom: 16px;
    }

    .unlock-panel h1 {
      margin: 0 0 6px;
      font-size: 30px;
      letter-spacing: 0;
    }

    .form {
      display: grid;
      gap: 14px;
      margin-top: 22px;
    }

    .notice {
      border-radius: 16px;
      padding: 12px 13px;
      background: rgba(255, 149, 0, .12);
      color: #7a4a00;
      font-size: 13px;
      line-height: 1.45;
    }

    .shell {
      width: min(1220px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 22px 0;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }

    .brand h1 {
      margin: 0 0 4px;
      font-size: 30px;
      letter-spacing: 0;
    }

    .top-actions, .section-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .layout {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    aside, main {
      border-radius: var(--radius);
      overflow: hidden;
    }

    aside {
      position: sticky;
      top: 16px;
      padding: 14px;
    }

    main { min-height: 680px; }

    .search-wrap {
      position: relative;
      margin-bottom: 12px;
    }

    .search-wrap .icon {
      position: absolute;
      left: 13px;
      top: 13px;
      width: 18px;
      height: 18px;
      color: var(--muted);
    }

    .search-wrap input {
      padding-left: 40px;
      background: rgba(118, 118, 128, .12);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .stat {
      background: rgba(255,255,255,.72);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px;
    }

    .stat b {
      display: block;
      font-size: 24px;
      line-height: 1;
      margin-bottom: 4px;
    }

    .side-actions {
      display: grid;
      grid-template-columns: 1fr repeat(4, 44px);
      gap: 8px;
      margin-bottom: 12px;
    }

    .add-platform {
      min-height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--blue);
      color: #fff;
      font-weight: 700;
    }

    .list {
      display: grid;
      gap: 8px;
      max-height: calc(100vh - 274px);
      overflow: auto;
      padding-right: 2px;
    }

    .platform {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 42px;
      align-items: center;
      gap: 8px;
      border-radius: 18px;
      background: rgba(255, 255, 255, .74);
      border: 1px solid transparent;
      padding: 9px;
    }

    .platform.active {
      border-color: rgba(0, 122, 255, .32);
      background: rgba(0, 122, 255, .12);
    }

    .platform-open {
      min-width: 0;
      min-height: 48px;
      padding: 0 2px;
      background: transparent;
      text-align: left;
      display: grid;
      align-content: center;
    }

    .platform-title {
      display: block;
      font-weight: 720;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .platform-sub {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .quick-copy {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(52, 199, 89, .13);
      color: #16803b;
      padding: 0;
      line-height: 1;
      position: relative;
      appearance: none;
      -webkit-appearance: none;
    }

    .editor {
      padding: 18px;
      display: grid;
      gap: 16px;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .section-title {
      min-width: 0;
    }

    .section-title h2 {
      margin: 0 0 4px;
      font-size: 24px;
      letter-spacing: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .full { grid-column: 1 / -1; }

    .group, .account-card {
      border-radius: 20px;
      background: var(--card);
      border: 1px solid rgba(60, 60, 67, .1);
      padding: 14px;
      box-shadow: 0 8px 22px rgba(0, 0, 0, .035);
    }

    .group { display: grid; gap: 14px; }

    .option-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 2px;
    }

    .single-card {
      display: grid;
      gap: 14px;
    }

    .switch {
      width: 52px;
      height: 32px;
      border-radius: 999px;
      background: rgba(120, 120, 128, .28);
      padding: 2px;
      display: flex;
      align-items: center;
      transition: background .18s ease;
    }

    .switch.on { background: var(--green); }

    .switch-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,.18);
      transform: translateX(0);
      transition: transform .18s ease;
    }

    .switch.on .switch-dot { transform: translateX(20px); }

    .account-list {
      display: grid;
      gap: 12px;
    }

    .account-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 0;
      scrollbar-width: none;
    }

    .account-tabs::-webkit-scrollbar { display: none; }

    .tab-pill {
      min-height: 38px;
      border-radius: 999px;
      padding: 0 14px;
      background: var(--fill);
      color: var(--text);
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .tab-pill.active {
      background: var(--blue);
      color: #fff;
      font-weight: 700;
    }

    .tab-add {
      width: 38px;
      height: 38px;
      border-radius: 999px;
      background: var(--blue);
      color: #fff;
      position: relative;
      flex: 0 0 auto;
    }

    .tab-add > .icon {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 18px;
      height: 18px;
    }

    .account-card {
      display: grid;
      gap: 12px;
    }

    .account-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .account-head h3 {
      margin: 0;
      font-size: 17px;
      letter-spacing: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .password-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 44px;
      gap: 8px;
      align-items: end;
    }

    .empty {
      min-height: 620px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
    }

    .empty .app-icon { margin: 0 auto 14px; }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      max-width: min(360px, calc(100vw - 36px));
      border-radius: 16px;
      padding: 12px 14px;
      background: rgba(29, 29, 31, .92);
      color: #fff;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
      font-size: 13px;
      z-index: 20;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 880px) {
      .shell {
        width: min(100vw - 18px, 720px);
        padding: 12px 0 22px;
      }

      .topbar { align-items: flex-start; }
      .brand h1 { font-size: 27px; }
      .brand .hint { display: none; }
      .layout { grid-template-columns: 1fr; }
      aside { position: static; }
      main { min-height: auto; }
      .side-actions { grid-template-columns: 1fr repeat(4, 42px); }
      .list {
        max-height: 315px;
        padding-bottom: 2px;
      }
      .grid { grid-template-columns: 1fr; }
      .section-head {
        position: sticky;
        top: 0;
        z-index: 5;
        margin: -18px -18px 0;
        padding: 14px 18px 12px;
        background: rgba(245, 245, 247, .78);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }
      .section-title h2 { font-size: 21px; }
      .section-actions .icon-btn {
        width: 42px;
        height: 42px;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const STORAGE_KEY = "personal-password-vault.v1";
    const app = document.getElementById("app");
    const toast = document.getElementById("toast");
    const enc = new TextEncoder();
    const dec = new TextDecoder();

    const state = {
      unlocked: false,
      key: null,
      salt: null,
      entries: [],
      selectedId: null,
      query: "",
      activeAccountIds: {}
    };

    const icons = {
      lock: '<rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path>',
      plus: '<path d="M12 5v14"></path><path d="M5 12h14"></path>',
      copy: '<rect x="9" y="9" width="11" height="11" rx="2"></rect><rect x="4" y="4" width="11" height="11" rx="2"></rect>',
      save: '<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><path d="M17 21v-8H7v8"></path><path d="M7 3v5h8"></path>',
      trash: '<path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M19 6l-1 14H6L5 6"></path>',
      search: '<circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>',
      upload: '<path d="M12 16V4"></path><path d="M7 9l5-5 5 5"></path><path d="M5 20h14"></path>',
      download: '<path d="M12 4v12"></path><path d="M7 11l5 5 5-5"></path><path d="M5 20h14"></path>',
      text: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5"></path><path d="M8 13h8"></path><path d="M8 17h6"></path>',
      key: '<circle cx="7.5" cy="14.5" r="3.5"></circle><path d="M10 12l9-9"></path><path d="M15 4l3 3"></path><path d="M13 6l3 3"></path>',
      user: '<circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path>'
    };

    function icon(name) {
      return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${icons[name]}</svg>`;
    }

    function iconButton(id, iconName, label, className = "icon-btn", extra = "") {
      return `<button type="button" id="${id}" class="${className}" title="${label}" aria-label="${label}" ${extra}>${icon(iconName)}</button>`;
    }

    function bytesToBase64(bytes) {
      let bin = "";
      bytes.forEach(byte => bin += String.fromCharCode(byte));
      return btoa(bin);
    }

    function base64ToBytes(value) {
      const bin = atob(value);
      return Uint8Array.from(bin, char => char.charCodeAt(0));
    }

    async function deriveKey(masterPassword, salt) {
      const baseKey = await crypto.subtle.importKey("raw", enc.encode(masterPassword), "PBKDF2", false, ["deriveKey"]);
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: 250000, hash: "SHA-256" },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function encryptVault() {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const data = enc.encode(JSON.stringify(state.entries));
      const encrypted = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, state.key, data);
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        version: 4,
        salt: bytesToBase64(state.salt),
        iv: bytesToBase64(iv),
        data: bytesToBase64(new Uint8Array(encrypted)),
        savedAt: new Date().toISOString()
      }));
    }

    async function decryptVault(masterPassword) {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      const salt = base64ToBytes(saved.salt);
      const key = await deriveKey(masterPassword, salt);
      const plain = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(saved.iv) },
        key,
        base64ToBytes(saved.data)
      );
      return { key, salt, entries: normalizeEntries(JSON.parse(dec.decode(plain))) };
    }

    function normalizeEntries(entries) {
      return (entries || []).map(entry => {
        if (Array.isArray(entry.accounts)) {
          return {
            ...entry,
            url: "",
            multiAccount: Boolean(entry.multiAccount || entry.accounts.length > 1),
            accounts: entry.accounts.map(normalizeAccount)
          };
        }
        return {
          id: entry.id || crypto.randomUUID(),
          title: entry.title || "未命名平台",
          url: "",
          notes: entry.notes || "",
          multiAccount: false,
          createdAt: entry.createdAt || new Date().toISOString(),
          updatedAt: entry.updatedAt || new Date().toISOString(),
          accounts: [normalizeAccount({
            label: entry.username || entry.email || "账号 1",
            username: entry.username || "",
            contact: entry.email || "",
            password: entry.password || "",
            notes: entry.notes || ""
          })]
        };
      });
    }

    function normalizeAccount(account) {
      return {
        id: account.id || crypto.randomUUID(),
        label: account.label || "",
        username: account.username || "",
        contact: account.contact || account.email || "",
        password: account.password || "",
        notes: account.notes || ""
      };
    }

    function escapeHtml(value = "") {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[char]));
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 2200);
    }

    function selectedEntry() {
      return state.entries.find(entry => entry.id === state.selectedId) || null;
    }

    function accountCount() {
      return state.entries.reduce((total, entry) => total + entry.accounts.length, 0);
    }

    function displayAccount(entry) {
      if (!entry) return null;
      return entry.accounts.find(account => account.username || account.password) || entry.accounts[0];
    }

    function activeAccount(entry) {
      const activeId = state.activeAccountIds[entry.id];
      return entry.accounts.find(account => account.id === activeId) || entry.accounts[0];
    }

    function filteredEntries() {
      const q = state.query.trim().toLowerCase();
      const list = q ? state.entries.filter(entry => {
        const platformMatch = [entry.title, entry.notes].some(value => (value || "").toLowerCase().includes(q));
        const accountMatch = entry.accounts.some(account =>
          [account.label, account.username, account.contact, account.notes].some(value => (value || "").toLowerCase().includes(q))
        );
        return platformMatch || accountMatch;
      }) : state.entries;
      return [...list].sort((a, b) => (a.title || "").localeCompare(b.title || "", "zh-CN"));
    }

    function renderLocked() {
      const hasVault = Boolean(localStorage.getItem(STORAGE_KEY));
      app.innerHTML = `
        <section class="unlock">
          <div class="unlock-panel glass">
            <div class="app-icon">${icon("key")}</div>
            <h1>账号密码本</h1>
            <p class="hint">${hasVault ? "输入主密码，查看你保存的平台账号。" : "设置一个主密码，创建你的账号密码本。"}</p>
            <form class="form" id="unlockForm">
              <label>
                主密码
                <input id="masterPassword" type="password" minlength="10" autocomplete="current-password" required />
              </label>
              ${hasVault ? "" : `
                <label>
                  再输入一次
                  <input id="confirmPassword" type="password" minlength="10" autocomplete="new-password" required />
                </label>
              `}
              <div class="notice">主密码不会被保存。忘记主密码时，已保存的账号密码无法恢复。</div>
              <button class="text-btn" type="submit">${hasVault ? "打开密码本" : "创建密码本"}</button>
            </form>
          </div>
        </section>
      `;

      document.getElementById("unlockForm").addEventListener("submit", async event => {
        event.preventDefault();
        const masterPassword = document.getElementById("masterPassword").value;
        try {
          if (hasVault) {
            const vault = await decryptVault(masterPassword);
            state.key = vault.key;
            state.salt = vault.salt;
            state.entries = vault.entries;
            state.unlocked = true;
            state.selectedId = state.entries[0]?.id || null;
            await encryptVault();
            render();
            showToast("已打开密码本");
          } else {
            const confirmPassword = document.getElementById("confirmPassword").value;
            if (masterPassword !== confirmPassword) {
              showToast("两次输入的主密码不一致");
              return;
            }
            if (masterPassword.length < 10) {
              showToast("主密码至少需要 10 个字符");
              return;
            }
            state.salt = crypto.getRandomValues(new Uint8Array(16));
            state.key = await deriveKey(masterPassword, state.salt);
            state.entries = [];
            state.unlocked = true;
            await encryptVault();
            render();
            showToast("密码本已创建");
          }
        } catch (error) {
          showToast("无法打开，请检查主密码");
        }
      });
    }

    function render() {
      if (!state.unlocked) {
        renderLocked();
        return;
      }

      const selected = selectedEntry();
      const list = filteredEntries();

      app.innerHTML = `
        <div class="shell">
          <div class="topbar">
            <div class="brand">
              <h1>账号密码本</h1>
              <p class="hint">默认单账号，需要时打开多账号。</p>
            </div>
            <div class="top-actions">
              ${iconButton("lockButton", "lock", "锁定")}
            </div>
          </div>

          <div class="layout">
            <aside class="glass">
              <div class="search-wrap">
                ${icon("search")}
                <input id="searchInput" type="search" placeholder="搜索" value="${escapeHtml(state.query)}" />
              </div>
              <div class="stats">
                <div class="stat"><b>${state.entries.length}</b><span class="small">平台</span></div>
                <div class="stat"><b>${accountCount()}</b><span class="small">账号</span></div>
              </div>
              <div class="side-actions">
                <button class="add-platform" id="newEntry" type="button">${icon("plus")}<span>平台</span></button>
                ${iconButton("copyAllText", "copy", "复制全部文本")}
                ${iconButton("exportText", "text", "导出文本")}
                ${iconButton("exportButton", "download", "导出加密备份")}
                ${iconButton("importButton", "upload", "导入加密备份")}
                <input id="importFile" type="file" accept="application/json" hidden />
              </div>
              <div class="list" aria-label="平台列表">
                ${list.length ? list.map(entry => platformTemplate(entry)).join("") : `<p class="hint" style="padding:10px;">没有匹配的平台账号。</p>`}
              </div>
            </aside>

            <main class="glass">
              ${selected ? editorTemplate(selected) : emptyTemplate()}
            </main>
          </div>
        </div>
      `;

      bindEvents();
    }

    function platformTemplate(entry) {
      const account = displayAccount(entry);
      const sub = entry.accounts.length > 1
        ? `${entry.accounts.length} 个账号 · ${account?.username || account?.label || "未填写账号"}`
        : (account?.username || account?.contact || "还没有填写账号");
      return `
        <div class="platform ${entry.id === state.selectedId ? "active" : ""}">
          <button class="platform-open" data-id="${entry.id}" type="button">
            <span class="platform-title">${escapeHtml(entry.title || "未命名平台")}</span>
            <span class="platform-sub">${escapeHtml(sub)}</span>
          </button>
          <button class="quick-copy" data-copy-id="${entry.id}" type="button" title="复制密码" aria-label="复制密码">${icon("copy")}</button>
        </div>
      `;
    }

    function editorTemplate(entry) {
      const currentAccount = activeAccount(entry);
      return `
        <form class="editor" id="entryForm">
          <div class="section-head">
            <div class="section-title">
              <h2>${escapeHtml(entry.title || "未命名平台")}</h2>
              <p class="small">${entry.multiAccount ? `${entry.accounts.length} 个账号` : "单账号"}</p>
            </div>
            <div class="section-actions">
              <button type="submit" class="icon-btn green" title="保存" aria-label="保存">${icon("save")}</button>
              ${iconButton("deleteEntry", "trash", "删除平台", "icon-btn danger")}
            </div>
          </div>

          ${entry.multiAccount ? multiAccountTemplate(entry, currentAccount) : singleAccountTemplate(entry, currentAccount)}
        </form>
      `;
    }

    function singleAccountTemplate(entry, account) {
      return `
        <section class="group single-card">
          <div class="grid">
            <label>
              平台名称
              <input name="title" value="${escapeHtml(entry.title)}" placeholder="微信、小红书、淘宝、邮箱" required />
            </label>
            <label>
              登录账号
              <input name="username:${account.id}" value="${escapeHtml(account.username)}" placeholder="用户名、手机号或邮箱" autocomplete="off" />
            </label>
            <label>
              绑定手机/邮箱
              <input name="contact:${account.id}" value="${escapeHtml(account.contact)}" placeholder="找回账号的信息" autocomplete="off" />
            </label>
            <label>
              密码
              <span class="password-row">
                <input name="password:${account.id}" type="text" value="${escapeHtml(account.password)}" autocomplete="off" placeholder="手动输入密码" />
                <button type="button" class="icon-btn green copy-account" data-account-id="${account.id}" title="复制密码" aria-label="复制密码">${icon("copy")}</button>
              </span>
            </label>
            <label class="full">
              备注
              <textarea name="accountNotes:${account.id}" placeholder="安全问题、登录方式、恢复码、会员信息等">${escapeHtml(account.notes || entry.notes)}</textarea>
            </label>
          </div>
          ${multiToggleTemplate(entry)}
        </section>
      `;
    }

    function multiAccountTemplate(entry, currentAccount) {
      return `
        <section class="group">
          <div class="grid">
            <label class="full">
              平台名称
              <input name="title" value="${escapeHtml(entry.title)}" placeholder="微信、小红书、淘宝、邮箱" required />
            </label>
            <label class="full">
              平台备注
              <textarea name="notes" placeholder="会员、恢复码位置、登录说明等">${escapeHtml(entry.notes)}</textarea>
            </label>
          </div>
          ${multiToggleTemplate(entry)}
        </section>

        <div class="account-tabs" aria-label="账号标签">
          ${entry.accounts.map((account, index) => {
            const title = account.label || account.username || `账号 ${index + 1}`;
            return `<button type="button" class="tab-pill ${account.id === currentAccount.id ? "active" : ""}" data-tab-account="${account.id}">${escapeHtml(title)}</button>`;
          }).join("")}
          <button type="button" id="addAccount" class="tab-add" title="添加账号" aria-label="添加账号">${icon("plus")}</button>
        </div>

        <div class="account-list">
          ${accountTemplate(currentAccount, entry.accounts.indexOf(currentAccount), true)}
        </div>
      `;
    }

    function multiToggleTemplate(entry) {
      return `
        <div class="option-row">
          <div>
            <strong>多账号</strong>
            <p class="small">同一平台有多个账号时打开</p>
          </div>
          <button type="button" id="multiToggle" class="switch ${entry.multiAccount ? "on" : ""}" role="switch" aria-checked="${entry.multiAccount}" aria-label="多账号">
            <span class="switch-dot"></span>
          </button>
        </div>
      `;
    }

    function accountTemplate(account, index, multiAccount) {
      const title = multiAccount ? (account.label || account.username || `账号 ${index + 1}`) : "账号";
      return `
        <section class="account-card" data-account-id="${account.id}">
          <div class="account-head">
            <h3>${escapeHtml(title)}</h3>
            <div class="section-actions">
              <button type="button" class="icon-btn green copy-account" data-account-id="${account.id}" title="复制密码" aria-label="复制密码">${icon("copy")}</button>
              ${multiAccount ? `<button type="button" class="icon-btn danger delete-account" data-account-id="${account.id}" title="删除账号" aria-label="删除账号">${icon("trash")}</button>` : ""}
            </div>
          </div>
          <div class="grid">
            ${multiAccount ? `
              <label>
                账号备注名
                <input name="accountLabel:${account.id}" value="${escapeHtml(account.label)}" placeholder="主号、小号、工作号" />
              </label>
            ` : ""}
            <label>
              登录账号
              <input name="username:${account.id}" value="${escapeHtml(account.username)}" placeholder="用户名、手机号或邮箱" autocomplete="off" />
            </label>
            <label>
              绑定手机/邮箱
              <input name="contact:${account.id}" value="${escapeHtml(account.contact)}" placeholder="找回账号的信息" autocomplete="off" />
            </label>
            <label>
              密码
              <span class="password-row">
                <input name="password:${account.id}" type="text" value="${escapeHtml(account.password)}" autocomplete="off" placeholder="手动输入密码" />
                <button type="button" class="icon-btn green copy-account" data-account-id="${account.id}" title="复制密码" aria-label="复制密码">${icon("copy")}</button>
              </span>
            </label>
            <label class="full">
              账号备注
              <textarea name="accountNotes:${account.id}" placeholder="安全问题、登录方式、恢复码、会员信息等">${escapeHtml(account.notes)}</textarea>
            </label>
          </div>
        </section>
      `;
    }

    function emptyTemplate() {
      return `
        <div class="empty">
          <div>
            <div class="app-icon">${icon("key")}</div>
            <h2>还没有平台</h2>
            <p class="hint">点左侧的“平台”开始记录。</p>
          </div>
        </div>
      `;
    }

    function bindEvents() {
      document.getElementById("lockButton").addEventListener("click", () => {
        state.unlocked = false;
        state.key = null;
        state.entries = [];
        state.selectedId = null;
        render();
      });

      document.getElementById("newEntry").addEventListener("click", async () => {
        const entry = {
          id: crypto.randomUUID(),
          title: "新平台",
          url: "",
          notes: "",
          multiAccount: false,
          accounts: [normalizeAccount({ label: "账号 1" })],
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        };
        state.entries.push(entry);
        state.selectedId = entry.id;
        await encryptVault();
        render();
      });

      document.getElementById("searchInput").addEventListener("input", event => {
        state.query = event.target.value;
        render();
      });

      document.querySelectorAll(".platform-open").forEach(button => {
        button.addEventListener("click", () => {
          state.selectedId = button.dataset.id;
          render();
        });
      });

      document.querySelectorAll(".quick-copy").forEach(button => {
        button.addEventListener("click", async () => {
          const entry = state.entries.find(item => item.id === button.dataset.copyId);
          const account = displayAccount(entry);
          await copyPassword(account?.password);
        });
      });

      document.getElementById("copyAllText").addEventListener("click", copyAllPlainText);
      document.getElementById("exportText").addEventListener("click", exportPlainText);
      document.getElementById("exportButton").addEventListener("click", exportBackup);
      document.getElementById("importButton").addEventListener("click", () => document.getElementById("importFile").click());
      document.getElementById("importFile").addEventListener("change", importBackup);

      const form = document.getElementById("entryForm");
      if (!form) return;

      document.querySelectorAll("[data-tab-account]").forEach(button => {
        button.addEventListener("click", async () => {
          const entry = selectedEntry();
          saveFormToEntry(form, entry);
          state.activeAccountIds[entry.id] = button.dataset.tabAccount;
          await encryptVault();
          render();
        });
      });

      document.getElementById("multiToggle").addEventListener("click", async () => {
        const entry = selectedEntry();
        saveFormToEntry(form, entry);
        entry.multiAccount = !entry.multiAccount;
        if (!entry.accounts.length) entry.accounts = [normalizeAccount({ label: "账号 1" })];
        state.activeAccountIds[entry.id] = entry.accounts[0].id;
        entry.updatedAt = new Date().toISOString();
        await encryptVault();
        render();
      });

      const addAccountButton = document.getElementById("addAccount");
      if (addAccountButton) {
        addAccountButton.addEventListener("click", async () => {
          const entry = selectedEntry();
          saveFormToEntry(form, entry);
          const account = normalizeAccount({ label: `账号 ${entry.accounts.length + 1}` });
          entry.accounts.push(account);
          state.activeAccountIds[entry.id] = account.id;
          entry.updatedAt = new Date().toISOString();
          await encryptVault();
          render();
        });
      }

      form.addEventListener("submit", async event => {
        event.preventDefault();
        const entry = selectedEntry();
        saveFormToEntry(form, entry);
        await encryptVault();
        render();
        showToast("已保存");
      });

      document.querySelectorAll(".copy-account").forEach(button => {
        button.addEventListener("click", () => {
          const formData = new FormData(form);
          copyPassword(formData.get(`password:${button.dataset.accountId}`));
        });
      });

      document.querySelectorAll(".delete-account").forEach(button => {
        button.addEventListener("click", async () => {
          const entry = selectedEntry();
          if (entry.accounts.length <= 1) {
            showToast("每个平台至少保留一个账号");
            return;
          }
          if (!confirm("确定删除这个账号吗？")) return;
          saveFormToEntry(form, entry);
          entry.accounts = entry.accounts.filter(account => account.id !== button.dataset.accountId);
          state.activeAccountIds[entry.id] = entry.accounts[0]?.id;
          entry.updatedAt = new Date().toISOString();
          await encryptVault();
          render();
          showToast("已删除账号");
        });
      });

      document.getElementById("deleteEntry").addEventListener("click", async () => {
        if (!confirm("确定删除这个平台和下面所有账号吗？")) return;
        state.entries = state.entries.filter(entry => entry.id !== state.selectedId);
        delete state.activeAccountIds[state.selectedId];
        state.selectedId = state.entries[0]?.id || null;
        await encryptVault();
        render();
        showToast("已删除平台");
      });
    }

    function saveFormToEntry(form, entry) {
      const data = new FormData(form);
      entry.title = data.get("title").trim();
      entry.url = "";
      entry.notes = data.get("notes")?.trim() || entry.notes || "";
      entry.accounts = entry.accounts.map(account => ({
        ...account,
        label: data.has(`accountLabel:${account.id}`) ? data.get(`accountLabel:${account.id}`).trim() : account.label,
        username: data.has(`username:${account.id}`) ? data.get(`username:${account.id}`).trim() : account.username,
        contact: data.has(`contact:${account.id}`) ? data.get(`contact:${account.id}`).trim() : account.contact,
        password: data.has(`password:${account.id}`) ? data.get(`password:${account.id}`).trim() : account.password,
        notes: data.has(`accountNotes:${account.id}`) ? data.get(`accountNotes:${account.id}`).trim() : account.notes
      }));
      entry.updatedAt = new Date().toISOString();
    }

    async function copyPassword(password) {
      if (!password) {
        showToast("这个账号还没有填写密码");
        return;
      }
      await navigator.clipboard.writeText(password);
      showToast("密码已复制");
    }

    function buildPlainText() {
      if (!state.entries.length) return "账号密码本为空";
      return state.entries.map(entry => {
        const lines = [`【${entry.title || "未命名平台"}】`];
        if (entry.notes) lines.push(`平台备注：${entry.notes}`);
        entry.accounts.forEach((account, index) => {
          lines.push("");
          lines.push(`账号 ${index + 1}${account.label ? `（${account.label}）` : ""}`);
          lines.push(`登录账号：${account.username || ""}`);
          lines.push(`绑定手机/邮箱：${account.contact || ""}`);
          lines.push(`密码：${account.password || ""}`);
          if (account.notes) lines.push(`账号备注：${account.notes}`);
        });
        return lines.join("\n");
      }).join("\n\n--------------------\n\n");
    }

    async function copyAllPlainText() {
      await navigator.clipboard.writeText(buildPlainText());
      showToast("全部账号密码已复制为文本");
    }

    function exportPlainText() {
      const blob = new Blob([buildPlainText()], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `account-password-book-${new Date().toISOString().slice(0,10)}.txt`;
      a.click();
      URL.revokeObjectURL(url);
      showToast("已导出文本");
    }

    function exportBackup() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) {
        showToast("没有可导出的数据");
        return;
      }
      const blob = new Blob([saved], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `account-password-book-encrypted-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    async function importBackup(event) {
      const file = event.target.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        const parsed = JSON.parse(text);
        if (!parsed.salt || !parsed.iv || !parsed.data) throw new Error("Invalid backup");
        localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
        state.unlocked = false;
        state.key = null;
        state.entries = [];
        state.selectedId = null;
        render();
        showToast("已导入，请用备份对应的主密码打开");
      } catch (error) {
        showToast("导入失败，文件格式不正确");
      } finally {
        event.target.value = "";
      }
    }

    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      navigator.serviceWorker.register("./service-worker.js").catch(() => {});
    }

    render();
  </script>
</body>
</html>
